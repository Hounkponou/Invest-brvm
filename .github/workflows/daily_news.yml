name: Actualités par société (Google News + résumé Gemini)

on:
  schedule:
    - cron: '30 6 * * *'  # 06:30 UTC, tous les jours
  workflow_dispatch:

jobs:
  news:
    runs-on: ubuntu-latest
    # Autorise le GITHUB_TOKEN à pousser le JSON régénéré (Vercel redéploie au push)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        working-directory: ./brvm-prediction
        run: pip install -r requirements.txt

      - name: Récupérer l'actualité par société
        working-directory: ./brvm-prediction
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py --task news

      - name: Committer le JSON des actualités
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          git add brvm-quant/public/data/news.json
          git commit -m "Automated company news update" || echo "No changes to commit"
          git push
