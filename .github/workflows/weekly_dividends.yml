name: Dividendes BRVM (hebdomadaire)

on:
  schedule:
    - cron: '0 6 * * 1'  # lundi 06:00 UTC (les dividendes changent rarement)
  workflow_dispatch:

jobs:
  dividends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Installer les dépendances
        working-directory: ./brvm-prediction
        run: pip install -r requirements.txt
      - name: Scraper les dividendes -> Supabase
        working-directory: ./brvm-prediction
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python main.py --task dividends
