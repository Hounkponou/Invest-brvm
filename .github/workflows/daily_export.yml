name: Export artefacts CDN (snapshot marché)

on:
  schedule:
    - cron: '5 18 * * 1-5'  # 18:05 UTC, après l'inférence
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Installer les dépendances
        working-directory: ./brvm-prediction
        run: pip install -r requirements.txt
      - name: Générer le snapshot marché
        working-directory: ./brvm-prediction
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python main.py --task export
      - name: Committer l'artefact
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          git add brvm-quant/public/data/market_latest.json brvm-quant/public/data/seasonality.json
          git commit -m "Automated market snapshot update" || echo "No changes"
          git push
